<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Dashboard - Host vs Client Quiz</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nOMQVqgTCffYd1Oh5m15qEJmGAcRYE+rRmOPGdOXpfngr05Qi3C8b4vyyTE1EELataUznd9UV5gQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <!-- CREATE VIEW -->
    <div id="create-view" class="glass-card wide">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Buat Kuis Baru</h1>
            <a href="/" class="btn btn-outline btn-sm">Kembali</a>
        </div>
        
        <form id="create-quiz-form" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="quiz-title">Nama Kuis</label>
                <input type="text" id="quiz-title" class="form-control" placeholder="Contoh: Kuis Pengetahuan Umum" required>
            </div>
            
            <div class="form-group">
                <label for="quiz-duration">Durasi Kuis (Detik)</label>
                <input type="number" id="quiz-duration" class="form-control" value="60" min="10" required>
            </div>
            
            <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Daftar Pertanyaan</h3>
            <div id="questions-container">
                <!-- Question forms will be injected here dynamically -->
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-outline" id="add-question-btn">+ Tambah Soal</button>
                <button type="submit" class="btn btn-primary" style="margin-left: auto;" id="submit-quiz-btn">Buat Room Kuis</button>
            </div>
        </form>
    </div>

    <!-- LOBBY VIEW -->
    <div id="lobby-view" class="glass-card wide hidden">
        <h1>Lobby Room Kuis</h1>
        <p class="subtitle" id="lobby-quiz-title">Menunggu Peserta Bergabung...</p>
        
        <div class="lobby-layout">
            <div class="qr-section">
                <h3>Kode Room</h3>
                <div class="room-code-display" id="lobby-room-code">----</div>
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">Scan QR code di bawah untuk join:</p>
                <div class="qr-container" id="qrcode"></div>
                <p style="margin-top: 1rem; font-size: 0.9rem;" id="lobby-join-url"></p>
            </div>
            
            <div class="participants-section">
                <h3>Peserta Terhubung (<span id="participant-count">0</span>)</h3>
                <div class="participant-badge-list" id="participants-list">
                    <!-- Participant badges will be injected here dynamically -->
                </div>
                
                <div class="btn-group-center" style="margin-top: 3rem;">
                    <button class="btn btn-primary btn-wide" id="start-quiz-btn" disabled>MULAI KUIS</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MONITOR VIEW -->
    <div id="monitor-view" class="glass-card wide hidden">
        <div class="timer-banner">
            <div>
                <h2 id="monitor-quiz-title">Kuis Sedang Berjalan</h2>
                <p style="color: var(--text-secondary);">Pantau jawaban peserta secara langsung</p>
            </div>
            <div class="timer-display pulse-timer">
                ⏳ <span id="monitor-timer">00</span>s
            </div>
        </div>
        
        <h3>Progres Peserta</h3>
        <div class="progress-list" id="monitor-progress-list" style="margin-top: 1rem; max-height: 400px; overflow-y: auto; padding-right: 0.5rem;">
            <!-- Progress bars will be injected here dynamically -->
        </div>
    </div>

    <!-- LEADERBOARD VIEW -->
    <div id="leaderboard-view" class="glass-card wide hidden">
        <h1 style="text-align: center; margin-bottom: 2rem;">🏆 Papan Peringkat Akhir</h1>
        
        <div class="leaderboard-list" id="leaderboard-list">
            <!-- Rank listings will be injected here dynamically -->
        </div>
        
        <div class="btn-group-center" style="margin-top: 3rem;">
            <button class="btn btn-secondary" id="restart-quiz-btn">Restart Kuis</button>
            <a href="/" class="btn btn-outline">Kembali ke Menu</a>
        </div>
    </div>

    <script src="/static/js/host.js"></script>
</body>
</html>

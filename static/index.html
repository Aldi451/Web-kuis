<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host vs Client Quiz Portal</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="glass-card">
        <h1 class="brand-title">HOST VS CLIENT</h1>
        <p class="subtitle">Platform kuis interaktif real-time. Pilih peran Anda untuk memulai.</p>
        
        <div class="landing-choices">
            <div class="choice-card" onclick="window.location.href='/static/host.html'">
                <div class="icon">👑</div>
                <h3>Saya Host</h3>
                <p>Buat room kuis baru, tambahkan pertanyaan, bagikan QR code, dan kendalikan kuis.</p>
            </div>
            
            <div class="choice-card" onclick="window.location.href='/static/client.html'">
                <div class="icon">⚡</div>
                <h3>Saya Peserta</h3>
                <p>Masuk ke dalam room kuis menggunakan kode atau QR code dan jawab pertanyaannya.</p>
            </div>
        </div>
    </div>
</body>
</html>
